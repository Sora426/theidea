<!DOCTYPE html>
<html>
<head>

<title>Letter Duel</title>

<style>
body { font-family: Arial; text-align: center; margin-top: 40px; }
button { margin: 4px; padding: 8px; }

</style>
</head>

<body>

<h1>Letter Duel</h1>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
